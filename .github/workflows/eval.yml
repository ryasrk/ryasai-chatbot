# RAG / Text-to-SQL quality evaluation gate.
# =============================================================================
# Live quality checks run weekly and on demand against a dedicated seeded org.
# Missing configuration, incomplete judging, or a regression fails this workflow.
# Standard PR CI remains offline; a release needs a successful live run.
#
# Required repo secrets/variables:
#   EVAL_DATABASE_URL   — postgresql:// URL of the eval Postgres (pgvector),
#                         seeded via scripts/migrate-demo-to-postgres.ts
#   EVAL_ORG_ID         — organization id owning the eval integration/content
#   EVAL_ENCRYPTION_SECRET_KEY — decrypts the dedicated org's BYOK configuration
#   EVAL_RAG_GOLDEN_FILE / EVAL_SQL_GOLDEN_FILE — repository paths (variables),
#                         each with at least 40 reviewed questions
#   Generator model/key are configured in the eval org's LlmConfig row
#   EVAL_JUDGE_BASE_URL / EVAL_JUDGE_KEY / EVAL_JUDGE_MODEL
#                       — judge config; MUST differ from the generator or the
#                         run is flagged self-judged (see benchmark/rag-eval.ts)
# =============================================================================

name: Quality Evals

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Mondays 03:00 UTC — off-peak; results reviewed, not gating
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  rag-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED, not `latest`. Two reasons, both measured rather than theoretical:
          #   1. HISTORICAL, no longer applies: `@cognee/cognee-ts` loaded a native
          #      Neon binding that SEGFAULTED the process under an active
          #      AsyncLocalStorage context on Bun 1.3.14 (4-line repro: enterWith()
          #      then import(...)), surfacing as `Graph database error: std::bad_alloc`
          #      and making memory silently unavailable. Bun 1.4.2 was fine. The
          #      package was REMOVED on 2026-09-24 (memory is the v1.6.0 HTTP server),
          #      so this hazard is gone — recorded rather than deleted so nobody
          #      re-adds the bindings assuming the crash was fixed.
          #   2. The pinning RULE still stands:
          #      a moving `latest` means the version CI tests is not the version
          #      anyone develops on, so a green CI does not describe what shipped.
          #   2. A moving `latest` means the version CI tests is not the version anyone
          #      develops on, so a green CI does not describe the code that shipped.
          # Bump this deliberately, with the suite re-run, rather than on every push.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          rm -rf node_modules/.prisma
          bunx prisma generate

      - name: Run RAGAS RAG evaluation
        env:
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          EVAL_ORG_ID: ${{ secrets.EVAL_ORG_ID }}
          ENCRYPTION_SECRET_KEY: ${{ secrets.EVAL_ENCRYPTION_SECRET_KEY }}
          EVAL_RAG_GOLDEN_FILE: ${{ vars.EVAL_RAG_GOLDEN_FILE }}
          RAGAS_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL }}
          RAGAS_JUDGE_KEY: ${{ secrets.EVAL_JUDGE_KEY }}
          RAGAS_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
        run: |
          if [ -z "$EVAL_RAG_GOLDEN_FILE" ] || [ -z "$DATABASE_URL" ]; then
            echo "::warning::RAG evaluation skipped: EVAL_RAG_GOLDEN_FILE or EVAL_DATABASE_URL not configured."
            exit 0
          fi
          bun run rag-eval --ci --golden="$EVAL_RAG_GOLDEN_FILE"

  sql-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED, not `latest`. Two reasons, both measured rather than theoretical:
          #   1. HISTORICAL, no longer applies: `@cognee/cognee-ts` loaded a native
          #      Neon binding that SEGFAULTED the process under an active
          #      AsyncLocalStorage context on Bun 1.3.14 (4-line repro: enterWith()
          #      then import(...)), surfacing as `Graph database error: std::bad_alloc`
          #      and making memory silently unavailable. Bun 1.4.2 was fine. The
          #      package was REMOVED on 2026-09-24 (memory is the v1.6.0 HTTP server),
          #      so this hazard is gone — recorded rather than deleted so nobody
          #      re-adds the bindings assuming the crash was fixed.
          #   2. The pinning RULE still stands:
          #      a moving `latest` means the version CI tests is not the version
          #      anyone develops on, so a green CI does not describe what shipped.
          #   2. A moving `latest` means the version CI tests is not the version anyone
          #      develops on, so a green CI does not describe the code that shipped.
          # Bump this deliberately, with the suite re-run, rather than on every push.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          rm -rf node_modules/.prisma
          bunx prisma generate

      # Needs EVAL_ORG_ID to own the target integration (live DB connection).
      - name: Run Text-to-SQL evaluation
        env:
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          EVAL_ORG_ID: ${{ secrets.EVAL_ORG_ID }}
          ENCRYPTION_SECRET_KEY: ${{ secrets.EVAL_ENCRYPTION_SECRET_KEY }}
        run: |
          if [ -z "${{ vars.EVAL_SQL_GOLDEN_FILE }}" ] || [ -z "$DATABASE_URL" ]; then
            echo "::warning::Text-to-SQL evaluation skipped: EVAL_SQL_GOLDEN_FILE or EVAL_DATABASE_URL not configured."
            exit 0
          fi
          bun run sql-eval --ci --integration "${{ secrets.EVAL_INTEGRATION_ID }}" --file "${{ vars.EVAL_SQL_GOLDEN_FILE }}"
