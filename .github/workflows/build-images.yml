name: Build Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # Manual trigger, because `push` alone cannot recover this situation: the published image set
  # and the referenced image set can drift, and the drift is INVISIBLE until someone installs.
  #
  # MEASURED: the `:embeddings` build step was added on 2026-09-24 18:42, but the last workflow run
  # was 2026-09-24 02:43 — 16 hours earlier. `install.sh` generates a compose file that pulls
  # `ghcr.io/ryasrk/ryasai-chatbot:embeddings`, and that tag did not exist. Reproduced end to end
  # through the installer's own artifacts: `docker compose pull` returned
  # "failed to resolve reference ...:embeddings: not found", exit 1 — so `curl … | bash` failed with
  # "Failed to pull prebuilt images" and no build fallback, i.e. NOBODY COULD INSTALL THE PRODUCT.
  # Every other referenced image (app, scheduler, cognee, pgvector, redis, searxng) resolved; only
  # this one was missing.
  #
  # With a manual trigger, publishing an image no longer requires a code change, so the gap between
  # "a build step exists" and "the tag is reachable" can be closed deliberately.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/ryasrk/ryasai-chatbot:app
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scheduler
          push: true
          tags: ghcr.io/ryasrk/ryasai-chatbot:scheduler
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ships in the default install: the compose `local-embeddings` service pulls
      # this tag. Without the job, `install.sh` references an image that was never
      # published and every install fails at pull time.
      #
      # Build context is tools/local-embeddings (NOT the repo root) — the
      # Dockerfile there copies only server.py and installs the CPU-only torch.
      # A repo-root context would ship the whole source tree into an image that
      # needs none of it.
      - name: Build & push local embeddings
        uses: docker/build-push-action@v6
        with:
          context: tools/local-embeddings
          file: tools/local-embeddings/Dockerfile
          push: true
          tags: ghcr.io/ryasrk/ryasai-chatbot:embeddings
          cache-from: type=gha
          cache-to: type=gha,mode=max
