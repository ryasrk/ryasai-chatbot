name: Build Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/ryasrk/ryasai-chatbot:app
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scheduler
          push: true
          tags: ghcr.io/ryasrk/ryasai-chatbot:scheduler
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ships in the default install: the compose `local-embeddings` service pulls
      # this tag. Without the job, `install.sh` references an image that was never
      # published and every install fails at pull time.
      #
      # Build context is tools/local-embeddings (NOT the repo root) — the
      # Dockerfile there copies only server.py and installs the CPU-only torch.
      # A repo-root context would ship the whole source tree into an image that
      # needs none of it.
      - name: Build & push local embeddings
        uses: docker/build-push-action@v6
        with:
          context: tools/local-embeddings
          file: tools/local-embeddings/Dockerfile
          push: true
          tags: ghcr.io/ryasrk/ryasai-chatbot:embeddings
          cache-from: type=gha
          cache-to: type=gha,mode=max
