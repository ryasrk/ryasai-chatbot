name: Build Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/ryasrk/ryasai-chatbot:app
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scheduler
          push: true
          tags: ghcr.io/ryasrk/ryasai-chatbot:scheduler
          cache-from: type=gha
          cache-to: type=gha,mode=max
