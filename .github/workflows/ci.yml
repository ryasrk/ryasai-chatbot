name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Redis is REQUIRED by this job, not optional. The unit suite has integration
    # tests that skip themselves when Redis is unreachable (scheduler-queue,
    # rag-fts-postgres, rag-retrieval-fusion, job-processor). Skipped tests execute
    # no code, so measured coverage COLLAPSES -- scheduler-queue.ts went 100%
    # (119/119) locally to 15.49% here, and six other modules drifted down with it.
    # `bun run coverage:gate` then failed on seven floors it had never breached,
    # because the gate compares measured coverage and the environment had quietly
    # removed the tests that produce it. This job had no services block at all, so
    # the gate could not pass on ANY commit, whatever the code said.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # redis.ts reads REDIS_URL; the default already points at localhost:6379, but
      # set it explicitly so the intent is visible and a future default change
      # cannot silently disable the integration tests again.
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED, not `latest`. Two reasons, both measured rather than theoretical:
          #   1. `@cognee/cognee-ts` loads a native Neon binding. On Bun 1.3.14, importing
          #      that binding while an AsyncLocalStorage context is active SEGFAULTS the
          #      process (4-line repro: enterWith() then import('@cognee/cognee-ts')), which
          #      surfaced as `Graph database error: std::bad_alloc` and made cognee memory
          #      silently unavailable. Bun 1.4.2 is fine. A floating `latest` cannot
          #      guarantee the version that actually works.
          #   2. A moving `latest` means the version CI tests is not the version anyone
          #      develops on, so a green CI does not describe the code that shipped.
          # Bump this deliberately, with the suite re-run, rather than on every push.
          bun-version: 1.4.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ponytail: bun install does NOT run prisma generate in CI the way a dev
      # checkout does — without this every Prisma type resolves to {} and tsc
      # emits ~130 errors. Cache restore must not resurrect a stale client
      # either, hence the rm below.
      - name: Generate Prisma client
        run: |
          rm -rf node_modules/.prisma
          bunx prisma generate

      - name: Lint (errors only — pre-existing warnings are tracked separately)
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      # Unit suite needs no database: scripts/test.ts injects a fallback
      # ENCRYPTION_SECRET_KEY and runs each file in its own bun process.
      - name: Unit tests
        run: bun run test

      # Coverage gate. Measures per-file (never the merged total — see
      # scripts/coverage-gate.ts) and fails when a module that is already well
      # covered regresses. Added because coverage climbed from 51% to 75% here
      # and nothing stopped it from being lost again.
      - name: Coverage
        run: bun run coverage

      - name: Coverage gate
        run: bun run coverage:gate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-typecheck-test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ryasai
          POSTGRES_PASSWORD: ryasai_dev
          POSTGRES_DB: ryasai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ryasai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://ryasai:ryasai_dev@localhost:5432/ryasai_e2e
      ENCRYPTION_SECRET_KEY: cca10b7d1b0e1d1a2f99a3f4c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED, not `latest`. Two reasons, both measured rather than theoretical:
          #   1. `@cognee/cognee-ts` loads a native Neon binding. On Bun 1.3.14, importing
          #      that binding while an AsyncLocalStorage context is active SEGFAULTS the
          #      process (4-line repro: enterWith() then import('@cognee/cognee-ts')), which
          #      surfaced as `Graph database error: std::bad_alloc` and made cognee memory
          #      silently unavailable. Bun 1.4.2 is fine. A floating `latest` cannot
          #      guarantee the version that actually works.
          #   2. A moving `latest` means the version CI tests is not the version anyone
          #      develops on, so a green CI does not describe the code that shipped.
          # Bump this deliberately, with the suite re-run, rather than on every push.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          rm -rf node_modules/.prisma
          bunx prisma generate

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      # The app build itself is validated by build-images.yml; this job proves
      # the e2e DB + mock stack works from a clean checkout.
      - name: Run e2e suite (dev server)
        run: bun run e2e

      # ponytail: e2e against the PRODUCTION artifact. Until this existed the
      # only e2e coverage was `next dev`, so the thing we actually ship — the
      # standalone build, with minified client code, prerendered server
      # components, real security headers, and outputFileTracing deciding which
      # packages exist at runtime — was never exercised. Every blocker found in
      # the 2026-09 audit surfaced by changing the environment, never by
      # re-reading code. A missing DB driver or a hydration mismatch is
      # invisible in dev and fatal here.
      - name: Build production bundle
        run: bun run build

      - name: Run e2e suite (production build)
        run: bunx playwright test -c playwright.prod.config.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
