name: Bug Report
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to reproduce the behavior.
      placeholder: "1. Go to '...'\n2. Click on '....'\n3. See error"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is the impact?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chatbot version
      description: The version you are running.
      placeholder: 0.4.0
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Relevant log output. Paste verbatim.
      render: shell
    validations:
      required: false
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Screenshots, context, related issues, etc.
    validations:
      required: false
