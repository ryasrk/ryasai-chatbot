# ryasai Chatbot — Docker Compose
# =============================================================================
# Deploy target: app + redis + postgres. DB is the app's own store (users, orgs,
# docs/chunks, integrations, schedules, audit). License validation runs against
# the SEPARATE central License-Validator at LICENSE_VALIDATOR_URL — not here.
#
# One-command install:  curl -sSL https://ryasai.my.id/install.sh | bash
# (that generates docker-compose.prod.yml from install.sh — this file is the
#  shorthand equivalent for folks who prefer to run compose directly)
#
# Images are PREBUILT in GitHub Actions (ghcr.io/ryasrk/ryasai-chatbot) — the
# VPS never compiles the app. `migrate` is a one-shot schema push (uses the
# scheduler image, which ships the full prisma CLI) that must finish before
# app/scheduler start.
# =============================================================================

services:
  migrate:
    image: ghcr.io/ryasrk/ryasai-chatbot:scheduler
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://ryasai:ryasai@db:5432/ryasai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["bun", "node_modules/prisma/build/index.js", "db", "push", "--accept-data-loss", "--skip-generate"]
    restart: "no"
    networks:
      - ryasai-net

  app:
    image: ghcr.io/ryasrk/ryasai-chatbot:app
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://ryasai:ryasai@db:5432/ryasai
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - LICENSE_VALIDATOR_URL=https://license.ryasai.my.id
      - LICENSE_PRODUCT=ryasai-chatbot
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ryasai-net

  scheduler:
    image: ghcr.io/ryasrk/ryasai-chatbot:scheduler
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://ryasai:ryasai@db:5432/ryasai
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - LICENSE_VALIDATOR_URL=https://license.ryasai.my.id
      - LICENSE_PRODUCT=ryasai-chatbot
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ryasai-net

  redis:
    image: redis:7-alpine
    # ponytail: cap RAM on a 1GB box; volatile-lru evicts only TTL'd keys,
    # so BullMQ job data (no TTL) is kept. Tradeoff documented in compose.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - ryasai-net

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=ryasai
      - POSTGRES_PASSWORD=ryasai
      - POSTGRES_DB=ryasai
    # ponytail: recipe-size Postgres — defaults assume 2GB+; these caps keep
    # it under ~200MB so app+redis+pg fit in 1GB RAM.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "effective_cache_size=128MB", "-c", "maintenance_work_mem=32MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryasai -d ryasai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ryasai-net

networks:
  ryasai-net:

volumes:
  pgdata:
  redisdata:
