# ryasai Chatbot — Docker Compose
# =============================================================================
# Deploy target: app + redis + postgres. DB is the app's own store (users, orgs,
# docs/chunks, integrations, schedules, audit). License validation runs against
# the SEPARATE central License-Validator at LICENSE_VALIDATOR_URL — not here.
#
# One-command install:  curl -sSL https://ryasai.my.id/install.sh | bash
# (that generates docker-compose.prod.yml from install.sh — this file is the
#  shorthand equivalent for folks who prefer to run compose directly)
#
# Images are PREBUILT in GitHub Actions (ghcr.io/ryasrk/ryasai-chatbot) — the
# VPS never compiles the app. `migrate` is a one-shot schema push (uses the
# scheduler image, which ships the full prisma CLI) that must finish before
# app/scheduler start.
# =============================================================================

services:
  migrate:
    image: ghcr.io/ryasrk/ryasai-chatbot:scheduler
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://ryasai:ryasai@db:5432/ryasai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ponytail: NO --accept-data-loss. A schema drift (e.g. a column that would
    # be dropped) must fail the migrate job LOUDLY so an operator intervenes;
    # silently destroying customer data on `docker compose up` is never okay.
    # Rollback: restore the newest pg_dump from backups/ (see docs/operations.md).
    entrypoint: ["bun", "node_modules/prisma/build/index.js", "db", "push", "--skip-generate"]
    restart: "no"
    networks:
      - ryasai-net

  app:
    image: ghcr.io/ryasrk/ryasai-chatbot:app
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://ryasai:ryasai@db:5432/ryasai
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - LICENSE_VALIDATOR_URL=https://license.ryasai.my.id
      - LICENSE_PRODUCT=ryasai-chatbot
      # All memory calls go to the sidecar over the compose network. Set here
      # rather than only in .env so an existing .env cannot silently keep the
      # app on the weaker in-process SDK after this upgrade.
      - COGNEE_SERVER_URL=http://cognee:8000
      # Required to reach the local embedding server. isBlockedHost() refuses
      # private/loopback hosts to prevent SSRF, and that guard applies to
      # SELF-HOSTED inference too: without this the app cannot call
      # `local-embeddings`, `resolveQueryEmbedding` returns null, and semantic
      # retrieval silently degrades to BM25 only while still reporting a
      # healthy-looking similarity score. Scoped to the compose service name,
      # not a wildcard.
      - LLM_ALLOWED_HOSTS=${LLM_ALLOWED_HOSTS:-local-embeddings}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # service_started, NOT service_healthy: memory is optional (every cognee
      # call degrades gracefully), so the chat UI must come up even if the graph
      # is still warming. Blocking startup on it would turn a memory outage into
      # a total outage, which is the opposite of the intended degradation.
      cognee:
        condition: service_started
    # ponytail: liveness probe against /api/v1/health (no DB hit — dependency
    # status lives at /api/health). bun is the runtime image, so no curl needed.
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://127.0.0.1:3000/api/v1/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ryasai-net

  scheduler:
    image: ghcr.io/ryasrk/ryasai-chatbot:scheduler
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://ryasai:ryasai@db:5432/ryasai
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - LICENSE_VALIDATOR_URL=https://license.ryasai.my.id
      - LICENSE_PRODUCT=ryasai-chatbot
      - COGNEE_SERVER_URL=http://cognee:8000
      # Required for the local embedding server. isBlockedHost() refuses
      # loopback/private hosts to prevent SSRF, and that guard applies to
      # SELF-HOSTED inference too — without this the app cannot reach
      # `local-embeddings`, so semantic retrieval silently degrades to BM25.
      # Scoped to this compose service name rather than a wildcard.
      - LLM_ALLOWED_HOSTS=${LLM_ALLOWED_HOSTS:-local-embeddings}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      cognee:
        condition: service_started
    # ponytail: NO HTTP healthcheck — the scheduler is a BullMQ worker with no
    # listening port. Liveness = restart: unless-stopped + Redis stalled-job
    # detection (BullMQ re-queues a dead worker's jobs automatically).
    restart: unless-stopped
    networks:
      - ryasai-net

  # Local embedding server (semantic RAG + cognee) — no hosted embedding key.
  #
  # WHY IT IS IN THE DEFAULT INSTALL: without it, `resolveQueryEmbedding` returns
  # null and retrieval silently degrades to BM25 only. MEASURED (tools/local-embeddings/
  # README): semantic retrieval contributed 3/5 hits on hard paraphrase questions,
  # and 0/5 without it — while still REPORTING a healthy-looking similarity score,
  # so nothing appears broken.
  #
  # DIMENSION: this model is 384-dim and `DocumentChunk.embedding` is declared
  # `vector(384)`, so they match by construction. A mismatch is the single most
  # damaging failure mode here — every vector write silently falls back to
  # `embeddingJson` and the pgvector leg returns an empty candidate set.
  # If you change EMBEDDING_MODEL, change the Prisma column to match:
  #   ALTER TABLE "DocumentChunk" DROP COLUMN embedding;
  #   ALTER TABLE "DocumentChunk" ADD COLUMN embedding vector(<new dims>);
  local-embeddings:
    build:
      context: ./tools/local-embeddings
      dockerfile: Dockerfile
    # Loopback only. This server has NO authentication, so publishing it on the
    # host's external interface would let anyone compute embeddings on the box.
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - EMBEDDING_HOST=0.0.0.0
      - EMBEDDING_PORT=8081
    volumes:
      # Model weights (~470MB) are downloaded on first use. Persist them or every
      # container restart re-downloads from HuggingFace.
      - hfcache:/root/.cache/huggingface
    healthcheck:
      # `python` is present in this image, so no curl/wget dependency.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot downloads ~470MB of weights, so the start period is generous;
      # a tighter one would mark a healthy container as permanently unhealthy.
      start_period: 300s
    restart: unless-stopped
    networks:
      - ryasai-net

  redis:
    image: redis:7-alpine
    # ponytail: cap RAM on a 1GB box; volatile-lru evicts only TTL'd keys,
    # so BullMQ job data (no TTL) is kept. Tradeoff documented in compose.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - ryasai-net

  # Cognee memory + knowledge-graph API server (v1.6.0) — the ONLY memory backend.
  #
  # WHY A SEPARATE SERVICE, and why there is no longer a fallback: the in-process
  # @cognee/cognee-ts bindings were REMOVED from this project on 2026-09-24. Their
  # write path was not trustworthy (0.2.0 reported success while storing nothing,
  # then poisoned the store with a "dataset completed" mark that survived a
  # downgrade), and running two cognee lineages against one store produced a LanceDB
  # collection sized 1536 while the configured embedder returned 384, plus a graph
  # with 0 nodes after a write that reported success. One lineage, one version, one
  # writer. Measured here: write 9s, recall 0.21s, and the stored token is FOUND.
  # See docs/cognee-http-migration.md.
  #
  # PINNED, never :latest — a memory store whose format the app must read should
  # not change under a `docker compose pull`.
  cognee:
    image: cognee/cognee:1.6.0
    # ponytail: the image's entrypoint already runs the API server on :8000; we
    # only say where to keep data and which backends to use. Local mode (sqlite +
    # kuzu + lancedb) means ZERO extra services — no second Postgres, no Neo4j —
    # which is what keeps this viable on an on-prem box.
    environment:
      # Storage: named volume below, so the graph survives a container recreate.
      - SYSTEM_ROOT_DIRECTORY=/cognee-storage/system
      - DATA_ROOT_DIRECTORY=/cognee-storage/data
      - DB_PROVIDER=sqlite
      - GRAPH_DATABASE_PROVIDER=kuzu
      - VECTOR_DB_PROVIDER=lancedb
      # The app reaches this over the private compose network with no auth. The
      # port is NOT published to the host (see below), so it is not exposed.
      - ENABLE_BACKEND_ACCESS_CONTROL=false
      # LLM + embeddings come from the customer's own provider (BYOK). These MUST
      # be set for the WRITE path (cognify makes its own LLM calls); the read path
      # tolerates empty values.
      - LLM_PROVIDER=${COGNEE_LLM_PROVIDER:-openai}
      - LLM_API_KEY=${COGNEE_LLM_API_KEY:-}
      - LLM_ENDPOINT=${COGNEE_LLM_ENDPOINT:-}
      - LLM_MODEL=${COGNEE_LLM_MODEL:-}
      - EMBEDDING_PROVIDER=${COGNEE_EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_API_KEY=${COGNEE_EMBEDDING_API_KEY:-}
      - EMBEDDING_ENDPOINT=${COGNEE_EMBEDDING_ENDPOINT:-}
      - EMBEDDING_MODEL=${COGNEE_EMBEDDING_MODEL:-}
      # MEASURED GOTCHA: the embedding dimension must MATCH what the endpoint
      # really returns, or every write fails with a pydantic LanceDataPoint
      # "List should have at least 3072 items" error that names the wrong cause.
      - EMBEDDING_DIMENSIONS=${COGNEE_EMBEDDING_DIMENSIONS:-1536}
      # Skips a 30s startup probe that fails the whole request when the embedding
      # endpoint is slow to warm up (it usually is).
      - COGNEE_SKIP_CONNECTION_TEST=true
      # litellm rejects params a provider does not support instead of dropping
      # them (e.g. `dimensions` on some embedding models).
      - LITELLM_DROP_PARAMS=true
      # BYOK: this customer's own LLM endpoint, which may be an internal host.
      - LLM_ALLOWED_HOSTS=${COGNEE_LLM_ALLOWED_HOSTS:-*}
      # --- v1.6.0 latency: turn OFF the per-turn session analysis -----------------
      # MEASURED on this sidecar with a real store, before these three:
      #   write 22-30s, search 24-95s (one search took 81s twice in a row).
      # The server log showed why: after every write it ran `SessionTurnAnalysis`, which
      # calls the LLM, failed schema validation, and retried — "litellm_native validation
      # retry 1/3: 1 validation error for SessionTurnAnalysis", six times in the log —
      # while the actual retrieval took 49 MILLISECONDS ("Found 3 chunks from vector
      # search"). So the timeout was never the graph; it was one feature retrying.
      # With these three off: write 9s, search 0.21s, and the stored token is still found.
      #
      # AUTO_FEEDBACK=false is the load-bearing one (it also disables the per-turn
      # feedback question, which is an LLM call). IMPROVE_AUTO_ENABLED=false stops the
      # automatic improve() pass after remember(). USAGE_LOGGING=false drops per-process
      # usage rows we do not bill on — the licence is flat, so per-turn usage here has no
      # consumer. The memory layer we need — store a turn, recall it later — never
      # needed any of the three.
      - AUTO_FEEDBACK=${COGNEE_AUTO_FEEDBACK:-false}
      - IMPROVE_AUTO_ENABLED=${COGNEE_IMPROVE_AUTO:-false}
      - USAGE_LOGGING=false
    # Applies tools/cognee-server/patch-fence-strip.sh, then runs the image's own
    # entrypoint. The image ships an ANCHORED fence-stripper that only handles a fence
    # wrapping the ENTIRE response, so prose before or after the block is rejected and
    # retried — measured: 24 rejections in one container, and 228s for a first write on a
    # fresh dataset versus 35.5s with the patch. A mount rather than an image rebuild, so
    # the patch is visible here and deletable the moment upstream widens the regex; the
    # script refuses to apply if the pattern is no longer anchored, which is how you know.
    entrypoint: ["/bin/bash", "/opt/cognee-patch/entrypoint-with-patch.sh"]
    # REACH THE HOST. `COGNEE_LLM_ENDPOINT` / `COGNEE_EMBEDDING_ENDPOINT` are typically
    # local model servers on the host (a local embedding sidecar, an on-prem gateway), and a
    # container cannot resolve `localhost` to its host. Without this mapping the sidecar
    # starts healthy and every write fails with a connection error that names the endpoint
    # rather than the cause. `host-gateway` is Docker's portable alias for the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./tools/cognee-server:/opt/cognee-patch:ro
      - cogneedata:/cognee-storage
    # NOTE: deliberately NO `ports:` — the app reaches this over the compose
    # network by name, so publishing would expose an unauthenticated memory API
    # to the host. Uncomment only for local debugging.
    # ports:
    #   - "127.0.0.1:8000:8000"
    healthcheck:
      # The image ships curl (upstream's own compose probes this same path).
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Long start period: first boot initialises the sqlite/kuzu/lancedb stores.
      start_period: 90s
    # ponytail: no memory cap. Upstream's compose reserves 8GB; this is a graph
    # build over the customer's documents, and a hard cap turns a slow cognify
    # into an OOM kill that loses the work. Bound the box, not the service.
    restart: unless-stopped
    networks:
      - ryasai-net

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=ryasai
      - POSTGRES_PASSWORD=ryasai
      - POSTGRES_DB=ryasai
    # ponytail: recipe-size Postgres — defaults assume 2GB+; these caps keep
    # it under ~200MB so app+redis+pg fit in 1GB RAM.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "effective_cache_size=128MB", "-c", "maintenance_work_mem=32MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryasai -d ryasai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ryasai-net

networks:
  ryasai-net:

volumes:
  pgdata:
  redisdata:
  cogneedata:
  hfcache:
