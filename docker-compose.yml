# ryasai Chatbot — Docker Compose
# =============================================================================
# Default: Postgres mode. To use SQLite instead:
#   1. Comment out the DATABASE_URL override in `app.environment`
#   2. Remove `depends_on.db` and the `db` service
#   3. Set DATABASE_URL=file:./db/custom.db in your .env
#   4. The /app/db volume in the Dockerfile persists the SQLite file.
#
# Postgres requires changing `provider = "sqlite"` to `provider = "postgresql"`
# in prisma/schema.prisma. See docs/postgres-migration.md for the full guide.
# =============================================================================

services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://ryasai:ryasai@db:5432/ryasai
      - REDIS_URL=rediss://redis:6379
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ryasai-net

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - ryasai-net

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=ryasai
      - POSTGRES_PASSWORD=ryasai
      - POSTGRES_DB=ryasai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryasai -d ryasai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ryasai-net

networks:
  ryasai-net:

volumes:
  pgdata:
  redisdata:
