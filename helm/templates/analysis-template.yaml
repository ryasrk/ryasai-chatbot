apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= 0.99
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{path="/api/v1/health",status="200",kubernetes_pod_name=~"{{`{{args.service-name}}`}}-.*"}[2m]))
            /
            sum(rate(http_requests_total{path="/api/v1/health",kubernetes_pod_name=~"{{`{{args.service-name}}`}}-.*"}[2m]))
