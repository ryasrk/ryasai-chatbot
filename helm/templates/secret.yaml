apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ryasai-chatbot.fullname" . }}
  labels:
    {{- include "ryasai-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secret }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
  {{- end }}
