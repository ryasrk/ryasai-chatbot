apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ryasai-chatbot.fullname" . }}
  labels:
    {{- include "ryasai-chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ryasai-chatbot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "ryasai-chatbot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Next.js standalone server — output: "standalone" in next.config.ts.
          command: ["bun"]
          args: [".next/standalone/server.js"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ryasai-chatbot.fullname" . }}
            - secretRef:
                name: {{ include "ryasai-chatbot.fullname" . }}
          # Liveness = lightweight (no DB hit); readiness = DB + Redis check.
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
