          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  config:
                    $ref: '#/components/schemas/NotificationConfig'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/schedules:
    get:
      tags: [Schedules]
      summary: List scheduled runs
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Scheduled run list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  schedules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduledRun'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Schedules]
      summary: Create scheduled run
      description: |
        Creates a cron-based scheduled run. The scheduler worker (separate
        process) polls every 60s and executes due prompts via the chat
        pipeline, then delivers results via the configured notification channel.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Scheduled run created (active by default).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  schedule:
                    $ref: '#/components/schemas/ScheduledRun'
        '400':
          description: Invalid input or cron expression.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/settings/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      description: Returns all API keys (key hashes are never returned; only prefix-based masked keys).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: API key list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [API Keys]
      summary: Create API key
      description: |
        Generates a new API key. The full key is returned **only once** in the
        response — store it securely. The key is hashed (SHA-256) at rest;
        only the prefix is stored for display. Rate limits are enforced
        per-key (in-memory counter + DB-backed daily reset).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          description: Label is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/monitoring:
    get:
      tags: [Monitoring]
      summary: Monitoring stats
      description: Returns 24h aggregated observability data — tool runs, failed requests, REST errors, blocked SQL, LLM token usage by purpose.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Monitoring data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringStats'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/traces:
    get:
      tags: [Monitoring]
      summary: List LLM traces
      description: Returns recent LLM call traces from the in-memory ring buffer (max 100, most-recent-first). Traces are lost on restart.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: LLM trace list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  traces:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trace'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
